<html lang="hi">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://www.gstatic.com" crossorigin><link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap"></noscript>
<style>
:root{color-scheme:light;--bg:#ffffff;--pn:#ffffff;--cd:#ffffff;--bd:#e4e1f2;--tx:#1a1838;--mu:#6b688a;--ac:#1d63e8;--ac2:#1d63e8;--gr:linear-gradient(90deg,#1d63e8,#3d9bff);
--fb:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fh:"Rajdhani","Poppins",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}.ic.f{fill:currentColor;stroke:none}
html,body{overflow-x:hidden}#stage{width:100%;overflow:hidden;position:relative}.wrap{width:1280px;transform-origin:0 0}
header{display:flex;align-items:center;gap:18px;padding:14px 20px}
.logo{display:flex;align-items:center;gap:12px;white-space:nowrap}
.lg{width:46px;height:46px;border-radius:14px;background:var(--gr);display:grid;place-items:center;color:#fff;font-size:26px;}
.lgo{width:52px;height:52px;flex:none;}.logo b{font:700 32px/1 var(--fh);letter-spacing:2px;display:block}.logo b span{color:var(--ac2)}.logo small{color:var(--mu);font-size:12px}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--pn);border:1px solid var(--bd);border-radius:99px;padding:0 18px;color:var(--mu);transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--ac2);}
.search input{flex:1;background:none;border:0;outline:0;color:var(--tx);font-size:15px;padding:13px 0;min-width:0}
.tb{width:46px;height:46px;border-radius:50%;background:var(--pn);border:1px solid var(--bd);color:var(--tx);font-size:22px;display:grid;place-items:center;cursor:pointer}
.main{display:flex;gap:16px;padding:0 20px 40px;align-items:flex-start}
aside{width:236px;flex:none;display:flex;flex-direction:column;gap:16px;position:sticky;top:12px}
nav{background:var(--pn);border:1px solid var(--bd);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:3px}
nav button{display:flex;align-items:center;gap:14px;background:none;border:0;color:var(--tx);font-size:15px;font-weight:500;padding:11px 14px;border-radius:13px;cursor:pointer;text-align:left;transition:background .15s}
nav button:hover{background:rgba(29,99,232,.14)}
nav button.on{background:var(--gr);color:#fff;font-weight:600;}
nav .ic{font-size:21px}
.promo{border-radius:20px;padding:22px 16px;background:linear-gradient(160deg,#1e40af,#2f7bff 60%,#1e3a8a);color:#fff;text-align:center;border:1px solid var(--bd)}
.promo .ic{font-size:56px;margin-bottom:6px}.promo h4{margin:0 0 12px;font:700 28px/1.05 var(--fh);font-style:italic}
.promo i{display:block;background:#ffc21a;color:#1a1200;font:700 18px/1.2 var(--fh);padding:9px;border-radius:8px;transform:rotate(-4deg)}
section{flex:1;min-width:0}
.hero{position:relative;height:380px;border-radius:24px;overflow:hidden;border:1px solid var(--bd);color:#fff}
.sl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 48px;opacity:0;transition:opacity .6s;pointer-events:none;overflow:hidden}
.sl.on{opacity:1;pointer-events:auto}
.sl:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 30%,rgba(255,255,255,.28),transparent 55%),linear-gradient(90deg,rgba(0,0,0,.45),transparent 70%)}
.sl>*{position:relative}
.sl .big{position:absolute;right:5%;top:50%;transform:translateY(-50%);width:260px;height:260px;opacity:.92;stroke-width:1.2;filter:drop-shadow(0 10px 24px rgba(0,0,0,.45))}
.tg{align-self:flex-start;background:rgba(0,0,0,.35);border:1px solid #fff4;border-radius:99px;padding:3px 12px;font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px}
.sl h2{margin:0;font:700 60px/1 var(--fh);max-width:62%;overflow-wrap:break-word;text-shadow:0 3px 12px rgba(0,0,0,.5)}
.sl p{margin:10px 0 20px;font-size:17px;max-width:52%;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.dn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--gr);color:#fff;border:2px solid rgba(255,255,255,.28);border-radius:99px;padding:13px 28px;font:600 17px var(--fb);cursor:pointer;text-decoration:none;transition:transform .15s,filter .15s}
.dn:hover{transform:translateY(-1px);filter:brightness(1.12)}.sl .dn{align-self:flex-start}
.ctl{position:absolute;right:18px;bottom:14px;display:flex;gap:8px;align-items:center}
.ctl button{width:40px;height:40px;border-radius:50%;border:1px solid #fff4;background:rgba(0,0,0,.55);color:#fff;font-size:20px;display:grid;place-items:center;cursor:pointer}
.dots{display:flex;gap:6px;margin-right:6px}.dots i{width:8px;height:8px;border-radius:50%;background:#fff6}.dots i.on{background:var(--ac2);width:22px;border-radius:99px}
.feat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--pn);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:14px 0 22px}
.feat div{display:flex;gap:12px;align-items:center;padding:0 6px}.feat .ic{font-size:30px;color:var(--ac2)}
.feat b{display:block;font-size:14px;font-weight:600}.feat small{color:var(--mu);font-size:12px;display:block}
.hd{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}
.hd h3{margin:0;font:700 28px/1 var(--fh);display:flex;align-items:center;gap:10px;letter-spacing:.3px}.hd h3 .ic{color:var(--ac2)}
.hd a{color:var(--ac2);font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);}
.th{height:130px;display:grid;place-items:center;color:#fff;position:relative;overflow:hidden}
.th:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 20%,rgba(255,255,255,.3),transparent 60%)}
.th .ic{position:relative;width:64px;height:64px;stroke-width:1.5;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px}
.cb h4{margin:0;font:700 20px/1.1 var(--fh);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt{color:var(--mu);font-size:13px;display:flex;align-items:center;gap:5px}.rt .ic{color:#1d63e8;font-size:15px}
.cb .dn{font-size:14px;padding:10px;width:100%;border-radius:11px;border:0;box-shadow:none;gap:8px}
.pl{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:11px;padding:8px;cursor:pointer;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px}
.pl:hover{border-color:var(--ac2)}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:50px 0}.empty .ic{font-size:60px;color:var(--ac2);display:block;margin:0 auto 10px;stroke-width:1.5}
.msg{color:var(--mu);margin:10px 0}
button:focus-visible,a:focus-visible,nav button:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
#pl{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;flex-direction:column;z-index:20;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#pl.on{display:flex}#pl .top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--pn)}
#pl .top b{font:700 22px var(--fh)}#pl iframe{flex:1;border:0;background:#fff;width:100%}
#pl .top button{background:var(--gr);color:#fff;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;display:flex;gap:8px;align-items:center}

.tb.ad{width:auto;border-radius:99px;padding:0 18px;gap:8px;font:600 14px var(--fb);background:var(--gr);color:#fff;border:0;display:none;align-items:center;}
.rm{background:none;border:1px solid var(--bd);color:#ff8a8a;border-radius:11px;padding:7px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.rm:hover{border-color:#ff8a8a}
.note{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;color:var(--mu);font-size:13px;margin:0 0 14px;display:none}
#ag{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
#ag.on{display:flex}
#ag .box{background:var(--pn);border:1px solid var(--bd);border-radius:20px;padding:20px;width:100%;max-width:460px;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
#ag h3{margin:0;font:700 26px var(--fh)}
#ag label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mu)}
#ag input,#ag select,#ag textarea{background:var(--bg);border:1px solid var(--bd);border-radius:10px;color:var(--tx);padding:10px 12px;font-size:14px;width:100%}
#ag .row{display:flex;gap:10px;justify-content:flex-end}
#ag .row button{border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer;border:1px solid var(--bd);background:none;color:var(--tx)}
#ag .row .go{background:var(--gr);color:#fff;border:0}
#ag .err{color:#ff8a8a;font-size:13px;min-height:1em}

.card{cursor:pointer}
.th .ig{position:relative;width:84px;height:84px;border-radius:20px;object-fit:cover;box-shadow:0 6px 18px rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.25)}
.sl .big.ig{width:220px;height:220px;border-radius:48px;object-fit:cover;opacity:1;border:3px solid rgba(255,255,255,.3)}
.sl.bi{padding:0}.sl.bi:before{display:none}.sl.bi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.sl.bi.inf{padding:0 48px}.sl.bi.inf>*{z-index:2}.sl.bi.inf>img{z-index:0}.sl.bi.inf:after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(0,0,0,.7),rgba(0,0,0,.15) 65%,transparent)}
.sl .bt{display:flex;gap:10px;align-self:flex-start}
.dn.sc{background:rgba(0,0,0,.35);box-shadow:none}
#gd{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:40;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#gd.on{display:flex}
#gd .bx{background:var(--pn);border:1px solid var(--bd);width:100%;max-width:720px;height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#gd .bar{position:sticky;top:0;z-index:2;display:flex;justify-content:flex-end;padding:10px 12px;background:var(--pn)}
#gd .bar button{width:40px;height:40px;border-radius:50%;background:var(--cd);border:1px solid var(--bd);color:var(--tx);display:grid;place-items:center;cursor:pointer;font-size:20px}
#gd .in{padding:0 22px 28px}
#gd .gh{display:flex;gap:16px;align-items:center}
#gd .gi{width:104px;height:104px;border-radius:24px;flex:none;object-fit:contain;display:grid;place-items:center;color:#fff}
#gd .gi .ic{width:52px;height:52px;stroke-width:1.5}
#gd h2{margin:0;font:700 34px/1.05 var(--fh);overflow-wrap:anywhere}
#gd .dv{color:var(--ac2);font-weight:600;margin-top:4px}#gd .ct{color:var(--mu);font-size:13px}
#gd .gs{display:flex;margin:20px 0;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
#gd .gs div{flex:1;text-align:center;padding:12px 4px;min-width:0}#gd .gs div+div{border-left:1px solid var(--bd)}
#gd .gs b{display:flex;align-items:center;justify-content:center;gap:4px;font-size:16px}#gd .gs b .ic{color:#1d63e8;font-size:15px}#gd .gs small{color:var(--mu);font-size:12px}
#gd .dn{width:100%}
#gd .shs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
#gd .shs img{height:300px;width:auto;flex:none;border-radius:14px;border:1px solid var(--bd);cursor:zoom-in;background:var(--bg)}
#gd h5{margin:24px 0 8px;font:700 22px/1.1 var(--fh)}
#gd .ab{margin:0;color:#3a3760;white-space:pre-line;overflow-wrap:anywhere;line-height:1.6}
#gd .inf div{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}
#gd .inf span{color:var(--mu);flex:none}#gd .inf b{font-weight:500;text-align:right;overflow-wrap:anywhere}#gd .inf a{color:var(--ac2)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
#lb.on{display:flex}#lb img{max-width:96vw;max-height:92vh;object-fit:contain;border-radius:8px}

/* ===== v2: Play Store style cards + details ===== */
.grid{grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
.th{height:auto;aspect-ratio:1/.92}
.th .ig{position:absolute;inset:0;width:100%;height:100%;border-radius:0;border:0;box-shadow:none;object-fit:contain}
.cb{padding:10px 10px 12px}.cb h4{font-size:18px}
.rt{justify-content:space-between;font-size:12.5px}.rt span{display:flex;align-items:center;gap:4px}.rt .ic{color:#1d63e8;font-size:14px}.rt .d .ic{color:var(--mu)}
.cb .dn{padding:9px 6px;font-size:13.5px}
/* ===== v3: site-matched card style ===== */
.card{padding:10px 10px 12px;gap:0}
.th{aspect-ratio:1/1;border-radius:16px;border:1px solid var(--bd);overflow:hidden}
.th:has(.ig){background:var(--bg)!important}
.th .ig{border-radius:0}
.cb{padding:12px 4px 2px;gap:9px;align-items:stretch}
.cb h4{font:700 20px/1.1 var(--fh);text-align:center}
.rt{justify-content:center;gap:0}
.rt .d{margin-left:12px;padding-left:12px;border-left:1px solid var(--bd)}
.cb .dn{border-radius:99px;padding:8px 6px;font-size:12px;font-weight:600;letter-spacing:.2px;gap:8px;}
.cb .dn .ic{width:14px;height:14px;font-size:14px;padding-right:8px;border-right:1px solid rgba(255,255,255,.35);box-sizing:content-box}

#gd .bx{max-width:820px}
#gd .gs b .ic,.sr .ic{color:#1d63e8}.sr{display:flex;gap:2px;justify-content:center}.sr .ic{font-size:14px}
.rate{display:flex;gap:4px}.rate button{background:none;border:0;color:#1d63e8;cursor:pointer;padding:2px;font-size:36px;line-height:1}.rate .ic{width:1em;height:1em}
.rbox{display:flex;gap:24px;align-items:center}.rbig{text-align:center;flex:none}.rbig b{font:700 58px/1 var(--fh);display:block}.rbig small{color:var(--mu)}
.hist{flex:1;display:flex;flex-direction:column;gap:6px}.hist div{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mu)}.hist i{flex:1;height:8px;border-radius:9px;background:#ece9f7;overflow:hidden}.hist u{display:block;height:100%;background:var(--ac2);border-radius:9px}
#rf{display:none;flex-direction:column;gap:8px;margin-top:10px}#rf input,#rf textarea{background:var(--bg);border:1px solid var(--bd);border-radius:10px;color:var(--tx);padding:10px 12px;font-size:14px;width:100%}#rf textarea{min-height:80px;resize:vertical}
#rsub:disabled{opacity:.5}.rerr{color:#ff8a8a;font-size:13px;min-height:1em}.hint{color:var(--mu);font-size:13px;margin:0 0 6px}
.rv{padding:12px 0;border-bottom:1px solid var(--bd)}.rv b{font-weight:600}.rv .sr{justify-content:flex-start;margin:3px 0}.rv p{margin:4px 0 0;color:#3a3760;overflow-wrap:anywhere;white-space:pre-line}
/* ===== v3: Play Store style details ===== */
#gd .gh{align-items:flex-start}
#gd .gi{border-radius:22px;border:1px solid var(--bd);background-color:var(--bg)}
#gd .gs{border:0;margin:20px 0 18px}
#gd .gs div{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px;padding:2px 4px;border:0}
#gd .gs div+div:before{content:"";position:absolute;left:0;top:14%;bottom:14%;border-left:1px solid var(--bd)}
#gd .gs b{font-size:16px;font-weight:600;min-height:24px}
#gd .gs small{font-size:12px;line-height:1.3}
#gd .ads{color:var(--mu);font-size:13px;margin-top:2px}#gd .gs small .ic{font-size:12px;vertical-align:-2px;margin-left:3px}#gd .gs .ag{border:2px solid var(--tx);border-radius:5px;padding:0 5px;font-size:14px;line-height:20px}
#gd .gs b.sz .ic{color:var(--tx);width:22px;height:22px}
#gd .inf div{border:0;padding:13px 0;font-size:15px}
#gd .inf b{font-weight:400;max-width:62%}
#gd .ah{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 8px}#gd .ah h5{margin:0}
#gd .ah button{width:40px;height:40px;border-radius:50%;border:0;background:rgba(29,99,232,.22);color:var(--tx);display:grid;place-items:center;cursor:pointer;font-size:20px;flex:none}
#gd .ah button:hover{background:rgba(29,99,232,.4)}
#gd .ab.cl{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
#gd .bar{justify-content:flex-end}#gd #gbk{display:none;margin-right:auto}#gd #gbk .ic{transform:rotate(180deg)}
#gb.av #gbk{display:grid}#gb.av #gcl{display:none}
#gb.av .in:not(#av){display:none}#gb:not(.av) #av{display:none}

/* ===== v4: Play Store stats row (4.6★ | Rated for | size | downloads) ===== */
#gd .gs{margin:22px 0 20px;padding:4px 0}
#gd .gs div{gap:6px;padding:0 4px}
#gd .gs div+div:before{top:8%;bottom:8%;border-left:1px solid var(--bd)}
#gd .gs b{font-size:19px;font-weight:600;min-height:28px;letter-spacing:.2px}
#gd .gs b .ic{color:#4285f4;width:19px;height:19px;font-size:19px;margin-left:2px}
#gd .gs small{font-size:13.5px;color:var(--mu);line-height:1.3}
#gd .gs .ag{border:2.5px solid var(--tx);border-radius:5px;padding:0 5px;font-size:20px;font-weight:700;line-height:24px;letter-spacing:0}
#gd .gs b.sz .ic{color:var(--tx);width:26px;height:26px;margin:0}
#gd .gs small .ic{width:14px;height:14px;font-size:14px;margin-left:5px;vertical-align:-2px;color:var(--mu)}
/* ===== v5: same look on every device (phone, tablet, laptop, PC, TV) =====
   Page = fixed 1280px design scaled to screen width; details popup = fixed 820px dialog scaled by --k (set in JS) */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
#gd{padding:0;overflow:hidden;background:rgba(255,255,255,.6);-webkit-backdrop-filter:blur(10px) saturate(1.1);backdrop-filter:blur(10px) saturate(1.1)}
#gd .bx{width:820px;max-width:none;flex:none;height:auto;max-height:var(--mh,92vh);border-radius:22px;transform:scale(var(--k,1));transform-origin:center center;will-change:transform;backface-visibility:hidden;contain:layout paint}
#gd.on{animation:gdf .16s ease-out}@keyframes gdf{from{opacity:0}to{opacity:1}}
#gd .shs img{content-visibility:auto}
</style>

<script>
const W=document.querySelector('.wrap'),ST=document.getElementById('stage');

const root=document.documentElement;

function navR(){$("nav").innerHTML=CATS.map(c=>`<button data-c="${c[0]}" class="${cat===c[0]?"on":""}">${ic(c[1])}${c[2]}</button>`).join("")}

const okImg=v=>/^(data:image\/|https?:\/\/)/i.test(v||"")?v:"";

/* ---- real ratings / downloads helpers ---- */

const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const DEV=(()=>{let d=LS("rh_dev");if(!d){d=(self.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2)).replace(/[^\w-]/g,"");LS("rh_dev",d)}return d})();
const stats=g=>{const c=[1,2,3,4,5].map(i=>+g["rc"+i]||0),n=c.reduce((a,b)=>a+b,0);return{c,n,avg:n?c.reduce((a,v,i)=>a+v*(i+1),0)/n:0}};
const kfmt=n=>n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,"")+"M":n>=1e3?(n/1e3).toFixed(1).replace(/\.0$/,"")+"K":""+n;
const starsS=v=>Array.from({length:5},(_,i)=>ic("star",i<Math.round(v)?"f":"")).join("");
const cssu=x=>"url('"+esc(x.replace(/['\\\n]/g,"%27"))+"')";
const heroBg=g=>{const sh=(Array.isArray(g.screenshots)?g.screenshots:[]).map(okImg).filter(Boolean)[0];return sh?`linear-gradient(90deg,rgba(10,9,32,.85),rgba(10,9,32,.15)),${cssu(sh)} center/cover`:grad(g.title)};
function trackDl(id){const k=LS("rh_dl")||{};if(k[id])return;k[id]=1;LS("rh_dl",k);
  fdb.collection("games").doc(id).update({dlCount:FV().increment(1)}).then(()=>{const g=games.find(x=>x.id===id);if(g)g.dlCount=(+g.dlCount||0)+1}).catch(()=>{k[id]=0;LS("rh_dl",k)})}
function card(g){
  const u=okUrl(g.url)||"#",im=okImg(g.icon),s=stats(g);
  const rt=`<span>${ic("star","f")}${s.n?s.avg.toFixed(1)+" ("+kfmt(s.n)+")":"New"}</span><span class="d">${ic("down")}${kfmt(+g.dlCount||0)}</span>`;
  return `<div class="card" data-id="${esc(g.id)}" tabindex="0"><div class="th" style="background:${grad(g.title)}">${im?`<img class="ig" src="${esc(im)}" alt="" loading="lazy" decoding="async">`:ic(gic(g))}</div><div class="cb"><h4>${esc(g.title)}</h4><div class="rt">${rt}</div><a class="dn" data-id="${esc(g.id)}" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${ic("down")}Download</a></div></div>`;
}
let banners=[],heroSig="";
function heroR(){
  const h=$("hero"),s=banners.filter(b=>b.active!==false&&okImg(b.image)).sort((a,b)=>(a.order||0)-(b.order||0));
  const gm=b=>b.showInfo!==false&&b.gameId?games.find(g=>g.id===b.gameId):null;
  const sig=JSON.stringify(s.map(b=>{const g=gm(b);return[b.id,b.image.length,b.url||"",b.gameId||"",g&&[g.title,g.category,g.desc,g.url]]}));
  if(sig===heroSig)return;heroSig=sig;clearInterval(timer);
  h.style.display=s.length?"":"none";if(!s.length){h.innerHTML="";return}
  h.innerHTML=s.map((b,i)=>{const g=gm(b);
    return `<div class="sl bi ${g?"inf":""} ${i?"":"on"}" data-b="${esc(b.id)}" style="${b.gameId||okUrl(b.url)?"cursor:pointer":""}"><img src="${esc(okImg(b.image))}" alt="${esc(b.title||"Banner")}" decoding="async">`+
    (g?`<span class="tg">${esc(g.category||"Free Game")}</span><h2>${esc(g.title)}</h2>${g.desc?`<p>${esc(g.desc)}</p>`:""}<div class="bt"><a class="dn" data-id="${esc(g.id)}" href="${esc(okUrl(g.url)||"#")}" target="_blank" rel="noopener noreferrer">${ic("down")}Download Now</a></div>`:"")+`</div>`}).join("")+
  (s.length>1?`<div class="ctl"><div class="dots">${s.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div><button id="pv" aria-label="Previous">${ic("prev")}</button><button id="nx" aria-label="Next">${ic("next")}</button></div>`:"");
  h.onclick=e=>{if(e.target.closest(".ctl"))return;const a=e.target.closest("a.dn");if(a){trackDl(a.dataset.id);return}
    const el=e.target.closest("[data-b]");if(!el)return;const b=s.find(x=>x.id===el.dataset.b);if(!b)return;
    if(b.gameId&&games.some(g=>g.id===b.gameId))openG(b.gameId);else if(okUrl(b.url))window.open(okUrl(b.url),"_blank","noopener")};
  si=0;const go=n=>{si=(n+s.length)%s.length;h.querySelectorAll(".sl").forEach((e,i)=>e.classList.toggle("on",i===si));h.querySelectorAll(".dots i").forEach((e,i)=>e.classList.toggle("on",i===si))};
  if(s.length>1){$("pv").onclick=()=>go(si-1);$("nx").onclick=()=>go(si+1);timer=setInterval(()=>{if(!$("gd").classList.contains("on"))go(si+1)},5000)}
}
function render(){
  navR();const q=$("q").value.trim().toLowerCase();
  const home=cat==="home"&&!q;$("top").style.display=home?"":"none";$("va").style.display=home&&games.length>6?"":"none";
  let f=games.filter(g=>(cat==="home"||cat==="all"||g.category===cat)&&(!q||(g.title+" "+(g.desc||"")+" "+(g.developer||"")).toLowerCase().includes(q)));
  $("ttl").innerHTML=q?ic("search")+"Search results":home?ic("flame")+"Popular Games":cat==="all"?ic("grid")+"All Games":ic(CI[cat])+cat;
  if(home)f=f.slice().sort((a,b)=>(+b.dlCount||0)-(+a.dlCount||0)||stats(b).avg-stats(a).avg).slice(0,6);
  $("list").innerHTML=!loaded?"":f.length?f.map(card).join(""):`<div class="empty">${ic("pad")}${games.length?"Is section mein abhi koi game nahi hai.":"Games jaldi aa rahe hain. Wapas check karna!"}</div>`;
}

/* ---- Play Store style details page ---- */
let cur=null,pick=0;
const starBtns=v=>[1,2,3,4,5].map(i=>`<button data-s="${i}" aria-label="${i} star">${ic("star",i<=v?"f":"")}</button>`).join("");
function openG(id,keep){
  const g=games.find(x=>x.id===id);if(!g)return;cur=id;
  const im=okImg(g.icon),u=okUrl(g.url)||"#",shots=(Array.isArray(g.screenshots)?g.screenshots:[]).map(okImg).filter(Boolean),s=stats(g),dl=+g.dlCount||0,my=(LS("rh_my")||{})[id]||0;pick=my;
  const st=[`<b>${s.n?s.avg.toFixed(1):"–"}${ic("star","f")}</b><small>${s.n?kfmt(s.n)+" reviews":"No ratings yet"}</small>`];
  if(g.ratedFor)st.push(`<b><span class="ag">${esc(g.ratedFor)}</span></b><small>Rated for ${esc(g.ratedFor)}${ic("info")}</small>`);
  if(g.size)st.push(`<b class="sz">${ic("down")}</b><small>${esc(g.size)} MB</small>`);
  st.push(`<b>${dl?kfmt(dl)+"+":"New"}</b><small>Downloads</small>`);
  const about=g.fullDesc||g.desc||"";
  const row=(k,v)=>v?`<div><span>${k}</span><b>${v}</b></div>`:"";
  const os=g.minAndroid?(/^[\d.]+$/.test(String(g.minAndroid).trim())?"Android "+esc(g.minAndroid)+" and up":esc(g.minAndroid)):"";
  const info=[row("Version",esc(g.version)),row("Updated on",esc(dday(g.updatedAt||g.createdAt))),row("Downloads",dl?dl.toLocaleString("en-IN")+"+ downloads":""),row("Download size",g.size?esc(g.size)+" MB":""),row("Required OS",os),row("Offered by",esc(g.developer)),row("Released on",esc(dday(g.createdAt))),row("Category",esc(g.category)),
    g.email?row("Contact",`<a href="mailto:${esc(g.email)}">${esc(g.email)}</a>`):"",
    okUrl(g.privacyUrl)?row("Privacy policy",`<a href="${esc(g.privacyUrl)}" target="_blank" rel="noopener noreferrer">See More</a>`):""].join("");
  const hist=[5,4,3,2,1].map(i=>`<div>${i}<i><u style="width:${s.n?s.c[i-1]/s.n*100:0}%"></u></i></div>`).join("");
  $("gb").innerHTML=`<div class="bar"><button id="gbk" aria-label="Back">${ic("right")}</button><button id="gcl" aria-label="Close">${ic("x")}</button></div><div class="in">
  <div class="gh">${im?`<img class="gi" src="${esc(im)}" alt="" decoding="async">`:`<div class="gi" style="background:${grad(g.title)}">${ic(gic(g))}</div>`}<div style="min-width:0"><h2>${esc(g.title)}</h2>${g.developer?`<div class="dv">${esc(g.developer)}</div>`:""}<div class="ct">${esc(g.category||"")}</div>${g.containsAds?`<div class="ads">Contains ads</div>`:""}</div></div>
  <div class="gs">${st.map(x=>`<div>${x}</div>`).join("")}</div>
  <a class="dn" data-id="${esc(g.id)}" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${ic("down")}Download APK</a>
  ${shots.length?`<div class="shs" id="gsh" style="margin-top:22px">${shots.map(x=>`<img src="${esc(x)}" alt="Screenshot" loading="lazy" decoding="async">`).join("")}</div>`:""}
  ${about||info?`<div class="ah"><h5>About this game</h5><button id="abt" aria-label="About this game">${ic("right")}</button></div>`:""}${about?`<p class="ab cl">${esc(about)}</p>`:""}
  <h5>Ratings &amp; reviews</h5>
  <div class="rbox"><div class="rbig"><b>${s.n?s.avg.toFixed(1):"0.0"}</b><div class="sr">${starsS(s.avg)}</div><small>${kfmt(s.n)} ratings</small></div><div class="hist">${hist}</div></div>
  <h5>Rate this game</h5><p class="hint">Tap a star to rate${my?" (you can change your rating)":""}</p>
  <div class="rate" id="rs">${starBtns(my)}</div>
  <div id="rf"><input id="rn" maxlength="30" placeholder="Your name (optional)" value="${esc(LS("rh_name")||"")}"><textarea id="rx" maxlength="400" placeholder="Write a review (optional)"></textarea><button class="dn" id="rsub">Submit rating</button><div class="rerr" id="rerr"></div></div>
  <h5>Reviews</h5><div id="rvl" class="hint">Loading…</div>
  </div>
  <div class="in" id="av"><h5 style="margin-top:6px">About this game</h5>${about?`<p class="ab">${esc(about)}</p>`:""}${g.whatsNew?`<h5>What’s new</h5><p class="ab">${esc(g.whatsNew)}</p>`:""}${info?`<h5>Game info</h5><div class="inf">${info}</div>`:""}</div>`;
  if(!keep)$("gb").classList.remove("av");
  $("gd").classList.add("on");document.body.style.overflow="hidden";if(!keep){$("gb").scrollTop=0;$("gcl").focus({preventScroll:true})}
  fdb.collection("games").doc(id).collection("ratings").orderBy("createdAt","desc").limit(20).get().then(q=>{
    const el=$("rvl");if(!el||cur!==id)return;const r=q.docs.map(d=>d.data()).filter(x=>x.text);
    el.className="";el.innerHTML=r.length?r.map(x=>`<div class="rv"><b>${esc(x.name||"Gamer")}</b><div class="sr">${starsS(x.stars)}</div><p>${esc(x.text)}</p></div>`).join(""):`<p class="hint">Abhi koi review nahi hai. Pehla review aap likho!</p>`;
  }).catch(()=>{const el=$("rvl");if(el)el.textContent="Reviews load nahi hue."});
}
async function submitRate(){
  const id=cur,g=games.find(x=>x.id===id),er=$("rerr");if(!g||!pick)return;
  const name=$("rn").value.trim().slice(0,30)||"Gamer",text=$("rx").value.trim().slice(0,400);
  $("rsub").disabled=true;er.textContent="";LS("rh_name",$("rn").value.trim().slice(0,30));
  const gr=fdb.collection("games").doc(id),rr=gr.collection("ratings").doc(DEV);let old=0;
  try{
    await fdb.runTransaction(async t=>{const o=await t.get(rr);old=o.exists?o.data().stars:0;
      if(old!==pick){const u={};u["rc"+pick]=FV().increment(1);if(old)u["rc"+old]=FV().increment(-1);t.update(gr,u)}
      t.set(rr,{stars:pick,name,text,createdAt:FV().serverTimestamp()})});
    if(old!==pick){g["rc"+pick]=(+g["rc"+pick]||0)+1;if(old)g["rc"+old]=Math.max(0,(+g["rc"+old]||0)-1)}
